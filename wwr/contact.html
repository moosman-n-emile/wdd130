<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
      content="This page includes contact information and a contact form which visitors can submit to ask questions about the company and its services.">
    <meta name="author" content="Emile Moosman">
    <title>Contact Us: Rafting Adventures</title>
    <link rel="stylesheet" href="../wwr/styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/wwr-logo.webp" alt="White Water Rafting Logo" class="icon">
        <nav>
            <ul class="navigation">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <div>
            <h1>Rafting Adventures</h1>
            <article>
                <address>
                    123 Main River Street<br>
                    Whitewater, Colorado<br>
                    Phone: +1 111 222 3344<br>
                    Email: <a
                      href="mailto:info@raftingadventures.com">info@raftingadventures.com</a><br>
                </address>
            </article>
        </div>
        <section class="contact">
            <div class="map">
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d3351.2732907967593!2d151.7115677622312!3d-32.86448790797943!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sen!2sau!4v1785582729465!5m2!1sen!2sau"
                  allowfullscreen="" loading="lazy"
                  referrerpolicy="strict-origin-when-cross-origin">
                </iframe>
            </div>
            <form class="form">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" placeholder="Enter First Name">

                <label for="email">Name</label>
                <input type="email" id="email" name="email" placeholder="Enter Email">

                <p>Message purpose</p>

                <label>
                    <input type="radio" name="purpose" value="general" checked>
                    General Inquiry
                </label><br>

                <label>
                    <input type="radio" name="purpose" value="social">
                    Reservation Question
                </label><br>

                <label>
                    <input type="radio" name="purpose" value="search">
                    Website Suggestion
                </label>

                <label for="message">Message</label>
                <textarea id="message" name="message" placeholder="Type here"></textarea>

                <label><input type="checkbox" id="subscribe" name="subscribe" checked>Please
                    subscribe me to the monthly newsletter</label>

                <button type="submit">Get In Touch!</button>
            </form>
        </section>
        <section class="employee">
            <h2>We Are Here to Serve You</h2>
            <figure>
                <img src="images/employee_one.webp" alt="Picture of Company President - Sandy">
                <figcaption>Sandy - President</figcaption>
            </figure>

            <figure>
                <img src="images/employee_two.webp"
                  alt="Picture of Company General Manager - James">
                <figcaption>James - Manager</figcaption>
            </figure>

            <figure>
                <img src="images/employee_three.webp"
                  alt="Picture of Customer Support Manager - Ramos">
                <figcaption>Ramos - Customer Support</figcaption>
            </figure>
        </section>
    </main>
    <footer>
        <p>©️2026 🚣 Rafting Adventures 🚣 Emile Moosman</p>
        <nav class="socialmedia">
            <a href="https://facebook.com"><img src="images/facebook.svg" alt="Facebook Icon"
                  class="icon"></a>
            <a href="https://linkedin.com"><img src="images/linkedin-square.svg" alt="Linkedin Icon"
                  class="icon"></a>
            <a href="https://instagram.com"><img src="images/instagram-square.svg"
                  alt="Instagram Icon" class="icon"></a>
        </nav>
    </footer>
</body>

</html>
